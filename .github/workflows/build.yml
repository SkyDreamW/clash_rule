name: build-sr-rules

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-sr-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 下载并转换规则
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, time, urllib.request
          from datetime import datetime, timezone

          BASE = "https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/"
          FILES = {
              "sr_direct": "sr_direct_list.module",
              "sr_proxy": "sr_proxy_list.module",
              "sr_reject": "sr_reject_list.module",
          }
          MIN_EXPECTED = {"sr_direct": 50000, "sr_proxy": 12000, "sr_reject": 90000}
          KEEP_TYPES = {
              "DOMAIN", "DOMAIN-SUFFIX", "DOMAIN-KEYWORD", "DOMAIN-REGEX",
              "IP-CIDR", "IP-CIDR6", "SRC-IP-CIDR", "GEOIP", "GEOSITE",
              "DST-PORT", "SRC-PORT", "NETWORK", "PROCESS-NAME",
          }
          POLICY_TOKENS = {
              "DIRECT", "PROXY", "REJECT", "REJECT-DROP",
              "PASS", "COMPATIBLE", "PROXY-DIRECT",
          }
          OUT_DIR = "dist"

          def fetch(url, retries=3):
              last = None
              for i in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return r.read().decode("utf-8-sig", errors="replace")
                  except Exception as e:
                      last = e
                      print("  第 %d 次失败：%s" % (i + 1, e))
                      time.sleep(3 * (i + 1))
              raise RuntimeError("下载失败：%s (%s)" % (url, last))

          def convert(text):
              seen, out, dropped = set(), [], {}
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line[0] in "#;[":
                      continue
                  parts = [p.strip() for p in line.split(",")]
                  tp = parts[0].upper()
                  if tp not in KEEP_TYPES:
                      dropped[tp] = dropped.get(tp, 0) + 1
                      continue
                  if len(parts) > 1 and parts[-1].upper() in POLICY_TOKENS:
                      parts = parts[:-1]
                  rule = ",".join(parts)
                  if rule not in seen:
                      seen.add(rule)
                      out.append(rule)
              return out, dropped

          def main():
              os.makedirs(OUT_DIR, exist_ok=True)
              meta = {
                  "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC"),
                  "source": "https://github.com/GMOogway/shadowrocket-rules",
                  "files": {},
              }
              failed = []
              for name, remote in FILES.items():
                  print("处理 %s ..." % remote)
                  try:
                      text = fetch(BASE + remote)
                  except Exception as e:
                      print("  X %s" % e)
                      failed.append(name)
                      continue
                  rules, dropped = convert(text)
                  count = len(rules)
                  print("  规则 %d 条，丢弃不支持类型：%s" % (count, dropped or "无"))
                  if count < MIN_EXPECTED[name]:
                      print("  X 数量异常（低于 %d），上游结构可能变了，中止" % MIN_EXPECTED[name])
                      failed.append(name)
                      continue
                  path = os.path.join(OUT_DIR, name + ".txt")
                  with open(path + ".tmp", "w", encoding="utf-8", newline="\n") as f:
                      f.write("\n".join(rules) + "\n")
                  os.replace(path + ".tmp", path)
                  meta["files"][name] = {"rules": count, "dropped": dropped, "source": remote}
              with open(os.path.join(OUT_DIR, "meta.json"), "w", encoding="utf-8", newline="\n") as f:
                  f.write(json.dumps(meta, ensure_ascii=False, indent=2) + "\n")
              if failed:
                  print("\n失败：%s" % ", ".join(failed))
                  return 1
              print("\n完成：%s" % meta["generated_at"])
              return 0

          sys.exit(main())
          PYEOF

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: update sr rules $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
